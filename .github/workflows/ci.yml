name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: pip install ruff numpy pytest
      - name: lint (format and rules)
        run: ruff check .
      - name: unit and integration tests
        run: python -m pytest
      - name: enforce 200-line ceiling under src/
        run: python scripts/check_limits.py
      - name: validate corpus
        run: python scripts/check_corpus.py
      - name: eval gate (metrics vs committed baseline)
        run: python -m eval.run_eval --gate
      # full unit / integration splits and additional adversarial gates land in M4+
