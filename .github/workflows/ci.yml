name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: pip install ruff
      - name: lint (format and rules)
        run: ruff check .
      - name: enforce 200-line ceiling under src/
        run: python scripts/check_limits.py
      - name: validate corpus
        run: python scripts/check_corpus.py
      # unit / integration and the eval gate land here in M2 and M3, once code exists.
